<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parent Feedback • Agentic AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Parent Feedback</h1>
      <h2>Share your feedback. Our AI will route it to the right department.</h2>
      <form id="feedback_form">
        <div class="row">
          <div>
            <label>Your Name</label>
            <input name="parent_name" placeholder="Optional" />
          </div>
          <div>
            <label>Your Email</label>
            <input name="parent_email" type="email" placeholder="Optional" />
          </div>
        </div>
        <label>Your Feedback</label>
        <textarea name="text" placeholder="Type your feedback here..." required></textarea>
        <button type="submit">Submit Feedback</button>
      </form>
      <div id="result"></div>
    </div>
    <div class="footer">Agentic AI Parent–University Engagement Platform</div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
